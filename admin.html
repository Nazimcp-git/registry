<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="bg-white p-8 rounded-lg shadow-md border border-gray-200 text-center">
                <h2 class="text-2xl font-bold mb-2">Administrator Access</h2>
                <p class="text-gray-500 mb-6">Enter the code to manage the alumni register.</p>
                <form id="login-form">
                    <input type="password" id="login-code" placeholder="Enter Admin Code" class="w-full text-center text-lg border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3">
                    <p id="login-error" class="text-red-500 text-sm mt-2 h-5"></p>
                    <button type="submit" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md shadow-sm transition-colors">
                        Login
                    </button>
                </form>
            </div>
            <p class="text-center text-xs text-gray-500 mt-4">
                Last updated: October 14, 2025, 7:15 PM IST
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ADMIN_CODE = "1234"; // IMPORTANT: Change this code for production
            const loginForm = document.getElementById('login-form');
            const loginCodeInput = document.getElementById('login-code');
            const loginError = document.getElementById('login-error');

            // If already logged in, redirect immediately
            if (sessionStorage.getItem('isAdmin') === 'true') {
                window.location.href = 'index.html';
            }

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (loginCodeInput.value === ADMIN_CODE) {
                    sessionStorage.setItem('isAdmin', 'true');
                    window.location.href = 'index.html'; // Redirect to the main application
                } else {
                    loginError.textContent = 'Incorrect code. Please try again.';
                    loginCodeInput.focus();
                }
            });
        });
    </script>

</body>
</html>
